<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bella Beauty | Catalog</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="shop.css" /> 
</head>
<body>

<header class="header">
  <div class="logo">Bella Beauty</div>
  <nav>
    <ul class="menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html" class="active">Catalog</a></li>
      <li> <a href="masters.html" class="active">Our Masters</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main class="shop-page">

    <section class="bf-banner">
  <div class="bf-left">
    <h1>Black Friday Sale</h1>
    <p>Limited time offer — <strong>20% OFF</strong> on all services!</p>
  </div>

  <div class="bf-right">
    <div class="timer">
      <div class="t-box"><span id="d">00</span><small>Days</small></div>
      <div class="t-box"><span id="h">00</span><small>Hours</small></div>
      <div class="t-box"><span id="m">00</span><small>Min</small></div>
      <div class="t-box"><span id="s">00</span><small>Sec</small></div>
    </div>
    <p class="bf-note" id="bf-status"></p>
  </div>
</section>
<div class="filters">
  <select id="filterCategory">
    <option value="all">All categories</option>
  </select>

  <select id="filterStock">
    <option value="all">All</option>
    <option value="in">In stock</option>
    <option value="out">Out of stock</option>
  </select>

  <select id="filterDiscount">
    <option value="0">Any discount</option>
    <option value="10">10%+ discount</option>
    <option value="20">20%+ discount</option>
    <option value="30">30%+ discount</option>
  </select>

  <select id="sortBy">
    <option value="default">Sort: Default</option>
    <option value="priceAsc">Price: Low to High</option>
    <option value="priceDesc">Price: High to Low</option>
    <option value="discountDesc">Discount: High to Low</option>
  </select>
</div>

  <section class="shop-section">
    <h2 class="section-title">Catalog</h2>
    <div id="catalog" class="cards shop-cards"></div>
  </section>

  <section class="cart-section cart-bottom">
    <h2 class="cart-title">Shopping Cart</h2>
    <p class="cart-subtitle"> Time to create beauty! </p>

    <div class="cart-box">
      <div id="cart-items" class="cart-items"></div>

      <div class="cart-footer">

      <div class="cart-total">
      <span>Total:</span>
      <strong><span id="total">0</span> ₸</strong>
     </div>

     <div class="cart-actions">
      <button id="clearCartBtn" class="clear-btn">Clear Cart</button>

      <a href="checkout.html" class="buy-btn" target="_blank"> Buy </a>
  </div>
</div>

   </div>
    </div>
  </section>

</main>

<footer class="footer">
  <p>© 2026 Bella Beauty</p>
</footer>

<script src="shop.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bella Beauty | Login</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body>

<header class="header">
  <div class="logo">Bella Beauty</div>

  <nav>
    <ul class="menu">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Catalog</a></li>
      <li><a href="auth.html" class="active">Login</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
</header>

<main class="auth-page">

  <section class="auth-card">
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Login or create an account to use the cart.</p>

    <div class="tabs">
      <button class="tab-btn active" data-tab="login">Login</button>
      <button class="tab-btn" data-tab="signup">Sign up</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="auth-form">
      <label>Email</label>
      <input id="loginEmail" type="email" placeholder="aruzhan@gmail.com" required>

      <label>Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••" required>

      <button class="btn-pink" type="submit">Login</button>
      <p class="auth-hint" id="loginMsg"></p>
    </form>

    <!-- SIGNUP -->
    <form id="signupForm" class="auth-form hidden">
      <label>Name</label>
      <input id="signupName" type="text" placeholder="Aruzhan" required>

      <label>Email</label>
      <input id="signupEmail" type="email" placeholder="aruzhan@gmail.com" required>

      <label>Password</label>
      <input id="signupPassword" type="password" placeholder="Create password" required>

      <button class="btn-pink" type="submit">Create account</button>
      <p class="auth-hint" id="signupMsg"></p>
    </form>

  </section>

</main>

<footer class="footer">
  <p>© 2026 Bella Beauty</p>
</footer>

<script src="auth.js"></script>
</body>
</html>
